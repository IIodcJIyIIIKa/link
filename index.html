<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>бот&lt;3</title>
    <meta name="description" content="бот коноло подслушано кременчуг&lt;3">
    <meta name="keywords" content="подслушано кременчуг, подслушано кременчуга, подслушка кременчуг, подслушка кременчуга, сущность кременчуг, сущность кременчуга">

    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="favicon.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-bg: #814c9c;
            --secondary-bg: #040719;
            --accent-color: #040719;
            --text-color: #ee0505;
            --telegram-blue: #1afbff;
            --hover-color: #040719;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
            background: var(--primary-bg);
        }

        body {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            background: var(--primary-bg);
            color: var(--text-color);
            font-family: 'Montserrat', sans-serif;
            line-height: 1.6;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: max(20px, env(safe-area-inset-top)) max(15px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(15px, env(safe-area-inset-left));
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(var(--accent-color) 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.03;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 30px 25px;
            background: var(--secondary-bg);
            border-radius: 20px;
            border: 2px solid var(--accent-color);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        .logo {
            width: min(400px, 80vw);
            height: min(400px, 80vw);
            margin: 0 auto 8px;
            position: relative;
            animation: glowPulse 3s infinite alternate ease-in-out;
            pointer-events: none;
        }

        .logo img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        .logo::after {
            content: '';
            position: absolute;
            inset: 0;
            background: transparent;
            z-index: 2;
        }

        @keyframes glowPulse {
            0% {
                filter: drop-shadow(0 0 5px rgba(227, 208, 181, 0.2));
            }

            100% {
                filter: drop-shadow(0 0 15px rgba(227, 208, 181, 0.5));
            }
        }

        h1 {
            font-size: clamp(1.6rem, 8vw, 2.8rem);
            background: linear-gradient(135deg, var(--accent-color) 0%, #ffffff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
            font-weight: 700;
            letter-spacing: 1px;
            overflow-wrap: anywhere;
        }

        .tagline {
            font-size: clamp(1rem, 4vw, 1.2rem);
            margin-bottom: 20px;
            color: var(--accent-color);
            font-weight: 500;
            opacity: 0.9;
        }

        p {
            font-size: clamp(0.9rem, 3.5vw, 1rem);
            margin: 0 auto 25px;
            opacity: 0.9;
            max-width: 450px;
            overflow-wrap: break-word;
        }

        .cta-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: 350px;
            min-height: 54px;
            padding: 14px 24px;
            background: var(--telegram-blue);
            color: #000;
            text-decoration: none;
            border-radius: 30px;
            font-size: clamp(1rem, 4vw, 1.2rem);
            font-weight: 600;
            margin-top: 10px;
            box-shadow: 0 8px 24px rgba(4, 7, 25, 0.8);
            border: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        @media (hover: hover) {
            .cta-button:hover {
                transform: translateY(-5px) scale(1.03);
                box-shadow: 0 12px 30px rgba(4, 7, 25, 0.9);
            }
        }

        .cta-button:active {
            transform: scale(0.97);
        }

        .telegram-icon {
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .telegram-icon svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
            display: block;
        }

        .related-tool {
            margin: 20px auto 0;
            padding: 14px 16px 0;
            max-width: 420px;
            border-top: 1px solid rgba(227, 208, 181, 0.12);
        }

        .related-tool p {
            max-width: 410px;
            margin: 0 auto 7px;
            font-size: 0.78rem;
            line-height: 1.45;
            color: rgba(255, 255, 255, 0.62);
            opacity: 1;
        }

        .related-tool a {
            color: var(--accent-color);
            font-weight: 700;
            text-decoration: none;
            border-bottom: 1px solid rgba(227, 208, 181, 0.35);
        }

        @media (max-width: 480px) {
            body {
                padding: max(15px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(15px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
            }

            .container {
                width: 100%;
                padding: 22px 16px;
                border-radius: 16px;
                border-width: 1px;
            }

            .logo {
                width: min(220px, 60vw);
                height: min(220px, 60vw);
                margin-bottom: 5px;
            }

            .cta-button {
                width: 100%;
                min-height: 52px;
                padding: 13px 18px;
                font-size: 1rem;
            }
        }

        @media (max-width: 360px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 18px 12px;
                border-radius: 14px;
            }

            .logo {
                width: 130px;
                height: 130px;
            }

            .cta-button {
                min-height: 48px;
                padding: 12px 15px;
                font-size: 0.95rem;
            }
        }

        @media (max-height: 500px) and (orientation: landscape) {
            body {
                align-items: flex-start;
                padding-top: 15px;
                padding-bottom: 15px;
            }

            .container {
                padding: 15px 20px;
            }

            .logo {
                width: 120px;
                height: 120px;
                margin-bottom: 0;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .logo {
                animation: none;
            }

            .cta-button {
                transition: none;
            }
        }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.addEventListener('contextmenu', function(e) {
                if (e.target.closest('.logo')) {
                    e.preventDefault();
                }
            });

            document.querySelectorAll('.logo img').forEach(function(img) {
                img.addEventListener('dragstart', function(e) {
                    e.preventDefault();
                });
            });
        });
    </script>
</head>

<body>
    <div class="container">
        <header>
            <div class="logo">
                <img src="logo.png" alt="Логотип" width="400" height="400">
            </div>
        </header>

        <main>
            <section class="cta-section">
                <a id="botLink" href="https://t.me/podslushka_robot" class="cta-button">
                    <span class="telegram-icon">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <path d="M12 0C5.37 0 0 5.37 0 12s5.37 12 12 12 12-5.37 12-12S18.63 0 12 0zm5.98 7.5l-1.87 8.82c-.14.66-.5.82-1.02.51l-2.82-2.08-1.36 1.31c-.15.15-.28.28-.57.28l.2-2.88 5.24-4.74c.23-.2-.05-.32-.35-.12l-6.47 4.07-2.79-.87c-.6-.19-.61-.6.13-.9l10.88-4.19c.5-.18.94.11.8.79z"/>
                        </svg>
                    </span>
                    <span>перейти к боту</span>
                </a>
            </section>
        </main>
    </div>
</body>
</html>
